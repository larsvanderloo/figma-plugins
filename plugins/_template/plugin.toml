# Plugin metadata. Read by tools/monday-sync/sync.py to find the right
# Monday boards for this plugin's PR events. Also a place for plugin-level
# config that the bootstrap process bakes into placeholders.
#
# Monday workspace structure (per runbooks/monday-workflow.md):
#   workspace_id = 6325546 (Figma Plugins)
#     └── folder/<plugin-slug>/
#           ├── Epics             — strategic tracks, multi-sprint
#           ├── Sprints           — sprint container
#           ├── Tasks             — work items (sync target for PRs)
#           ├── Retrospectives    — sprint retros
#           ├── Bugs Queue        — bug intake
#           └── Capacity          — sprint capacity planning
#
# The 6 boards come from Monday's standard "Scrum Team" template. Each
# plugin gets its own folder with these 6 boards. Sync targets the Tasks
# board's `task_status` and `link` columns.

[plugin]
slug = "{{plugin_slug}}"
name = "{{plugin_name}}"
class_prefix = "{{plugin_class}}"
version = "0.1.0"
editor_types = {{editor_types_toml}}

# Owner agent — which subagent has primary responsibility per the
# ownership map in CLAUDE.md. One of:
#   project-pm | figma-api-engineer | ui-engineer |
#   plugin-tester | release-engineer | product-researcher
# (Same set as the Owner Agent dropdown on Monday's Tasks / Epics / Bugs Queue boards.)
owner_agent = "ui-engineer"

[monday]
# Set enabled = false for offline/experimental plugins that shouldn't sync.
enabled = {{monday_enabled}}
# Workspace and folder are constants for this monorepo.
workspace_id = "6325546"
folder_id = "{{plugin_folder_id}}"
# Board IDs from the duplicated Scrum Team template. Sync writes to the
# Tasks board on PR events; the others are referenced for context (e.g.
# Bugs Queue when a PR closes a bug item).
tasks_board_id = "{{plugin_tasks_board_id}}"
sprints_board_id = "{{plugin_sprints_board_id}}"
epics_board_id = "{{plugin_epics_board_id}}"
bugs_board_id = "{{plugin_bugs_board_id}}"
retros_board_id = "{{plugin_retros_board_id}}"
capacity_board_id = "{{plugin_capacity_board_id}}"

[validation]
# Bundle-size budget for the `code` bundle, minified+gzipped, in KB. Per
# `docs/perf/<plugin>.md`. CI fails when over.
code_bundle_kb_budget = 50
# Bundle-size budget for the `ui` bundle, minified+gzipped, in KB.
ui_bundle_kb_budget = 250
# Initial-paint latency target (plugin open → first paint), in ms. Per
# `plugins/<slug>/docs/threading/<feature>.md`. Used by the e2e gauntlet.
init_paint_ms_budget = 200

[message_bus]
# MESSAGE_BUS_VERSION — bumped when the contract in shared/messages.ts
# changes in a backwards-incompatible way. Migration tests added in
# tests/migrations/ when bumped.
version = 1

[release]
# Where this plugin is intended to ship.
formats = ["figma-community"]
# Primary host editor type for in-development testing.
primary_editor = "figma"
