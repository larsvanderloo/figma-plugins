# Lefthook — monorepo pre-commit hook configuration.
#
# Owned by plugin-tester (validation tooling is in-domain).
# Installed automatically on `pnpm install` via the `prepare` script in
# package.json (`lefthook install --reset-hooks-path`).
#
# --reset-hooks-path: unsets git's core.hooksPath so lefthook manages all
# hooks from .git/hooks/ (the default). The pre-existing commit-msg behaviour
# is preserved via the commit-msg section below, which calls
# .githooks/mon-id-check.sh — the versioned MON-id logic script.
#
# Sprint 1 task 1.0 — addresses Sprint 0 retro item:
# "Multi-CI-failure recovery: agents skipped prettier + missed @testing-library
#  cleanup" (MON-2893811078).

pre-commit:
  parallel: true
  commands:
    prettier-write:
      # Auto-fix formatting on staged *.ts, *.vue, *.md, *.json, *.yml files.
      # Deterministic rewrites are safe to auto-fix; saves a commit-cycle.
      # stage_fixed: true re-stages any files prettier rewrites so the fixed
      # content is what actually lands in the commit.
      glob: '*.{ts,vue,md,json,yml}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

    eslint:
      # Block the commit on ESLint errors. No --fix: keeps changes deliberate.
      # vue files are excluded from the ESLint config (vue-tsc covers them);
      # the glob here mirrors eslint.config.ts which ignores *.vue.
      glob: '*.{ts,tsx,mts,cts}'
      run: pnpm exec eslint --max-warnings=0 {staged_files}

commit-msg:
  commands:
    mon-id-check:
      # Runs the MON-id check from .githooks/mon-id-check.sh.
      # Behaviour: auto-appends [#MON-<id>] from branch name when present;
      # warns (does not block) when no MON id is found.
      # {1} is the path to the commit message file (standard git hook arg).
      run: bash .githooks/mon-id-check.sh {1}
