name: Release

# Release pipeline. Triggered when a tag matching `<plugin-slug>@v*` is
# pushed to the repo. Today only `welder-editor` is wired; add a new job
# (or extend matrix) when another plugin needs auto-release.
#
# What it does for `welder-editor@v*` tags:
#   1. Checkout the tagged commit.
#   2. npm ci + build + typecheck (same gates as the validate workflow's
#      npm-plugin-welder-editor job — release artifacts must pass CI).
#   3. Validate manifest + build artifacts via tools/validate_manifest.py.
#   4. Stage the loadable bundle (manifest.json + dist/code.js +
#      dist/ui.html) into welder-editor-<version>/, zip it.
#   5. gh release create on the private `welder-editor-releases` repo
#      (NOT this monorepo) with hand-crafted notes from the git log of
#      this repo since the previous welder-editor tag. Source code never
#      lands on the release surface; only the loadable bundle.
#
# Auth: this workflow needs a PAT with write access to the private
# releases repo, stored as the RELEASES_REPO_TOKEN secret on this repo.
# A fine-grained PAT scoped to `larsvanderloo/welder-editor-releases`
# with "Contents: write" is the minimum; a classic `repo`-scope PAT
# also works. The default GITHUB_TOKEN can't reach a different repo.
#
# Self-hosted macOS arm64 runner — same setup as validate.yml. The
# launchd-spawned runner needs PATH munging so /opt/homebrew/bin
# resolves npm/python3.

on:
  push:
    tags:
      - 'welder-editor@v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)release, e.g. welder-editor@v0.2.0'
        required: true
        type: string

permissions:
  contents: read

env:
  PATH_HOMEBREW: /opt/homebrew/bin:/opt/homebrew/sbin:/usr/bin:/bin:/usr/sbin:/sbin
  RELEASES_REPO: larsvanderloo/welder-editor-releases

jobs:
  welder-editor:
    name: welder-editor release
    # No job-level `if:` guard — the `on:` trigger already filters tag
    # pushes to `welder-editor@v*`, and workflow_dispatch input is
    # validated in the "Resolve tag ref" step below so a missing or
    # malformed input fails loudly with an explicit message instead of
    # silently skipping the whole job.
    runs-on: [self-hosted, macOS, ARM64]
    env:
      PATH: /opt/homebrew/bin:/opt/homebrew/sbin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - name: Resolve tag ref
        id: tagref
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -z "${DISPATCH_TAG:-}" ]; then
              echo "::error::workflow_dispatch was triggered without a 'tag' input. Re-run from Actions → Release → Run workflow and fill in e.g. welder-editor@v0.2.0."
              exit 1
            fi
            case "$DISPATCH_TAG" in
              welder-editor@v*) ;;
              *)
                echo "::error::tag input must start with 'welder-editor@v', got '$DISPATCH_TAG'."
                exit 1
                ;;
            esac
            echo "ref=refs/tags/$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
            echo "tag=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.ref_name }}" in
              welder-editor@v*) ;;
              *)
                echo "::error::push trigger fired on unexpected ref '${{ github.ref_name }}' — expected welder-editor@v*."
                exit 1
                ;;
            esac
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (tagged commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tagref.outputs.ref }}
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        # Tag is welder-editor@v0.2.0 → version is 0.2.0 (no leading v)
        # Used for the artifact directory name and zip filename.
        run: |
          TAG="${{ steps.tagref.outputs.tag }}"
          VERSION="${TAG#welder-editor@v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$TAG" ]; then
            echo "::error::Could not extract version from tag '$TAG'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG → version: $VERSION"

      - name: Install (npm ci with lockfile fallback)
        working-directory: plugins/welder-editor
        run: |
          if ! npm ci --no-audit --no-fund; then
            echo "::warning::npm ci failed (lockfile drift) — falling back to npm install"
            npm install --no-audit --no-fund
          fi

      - name: Sync package.json version to tag
        # vite.config.ts reads package.json.version at build time and
        # injects it as __APP_VERSION__ for the iframe's "v0.x.y" badge.
        # main's package.json drifts from the tags (no commit bumps it),
        # so without this step every release ships with whatever stale
        # version was last committed (e.g. v0.2.3 zip showed v0.2.2 badge).
        # `npm version --no-git-tag-version` rewrites only the version
        # field; no commit, no tag, just the file in this checkout used
        # for the build.
        working-directory: plugins/welder-editor
        run: npm version --no-git-tag-version --allow-same-version "${{ steps.version.outputs.version }}"

      - name: Build + typecheck
        working-directory: plugins/welder-editor
        run: |
          npm run build
          npm run typecheck:ui

      - name: Validate manifest + build artifacts
        run: |
          python3 tools/validate_manifest.py plugins/welder-editor/manifest.json
          python3 tools/validate_manifest.py --build-artifacts plugins/welder-editor/manifest.json

      - name: Stage artifact
        # Layout inside the zip mirrors what a developer would point Figma
        # at via "Import plugin from manifest": a folder containing the
        # manifest and a dist/ subdirectory with the two bundles.
        run: |
          set -euo pipefail
          STAGE="welder-editor-v${{ steps.version.outputs.version }}"
          rm -rf "build-release/$STAGE"
          mkdir -p "build-release/$STAGE/dist"
          cp plugins/welder-editor/manifest.json "build-release/$STAGE/"
          cp plugins/welder-editor/dist/code.js "build-release/$STAGE/dist/"
          cp plugins/welder-editor/dist/ui.html "build-release/$STAGE/dist/"
          ls -la "build-release/$STAGE" "build-release/$STAGE/dist"

      - name: Zip artifact
        working-directory: build-release
        run: |
          set -euo pipefail
          STAGE="welder-editor-v${{ steps.version.outputs.version }}"
          zip -r "$STAGE.zip" "$STAGE"
          ls -la "$STAGE.zip"

      - name: Build release notes from source git log
        id: notes
        # Hand-craft notes from the source-repo git log between the prior
        # welder-editor@v* tag and the current one, filtered to the
        # plugin path. The releases repo has no source history of its
        # own, so `gh release create --generate-notes` would produce
        # nothing useful there; we feed it pre-rendered markdown
        # instead.
        run: |
          set -euo pipefail
          CURRENT="${{ steps.tagref.outputs.tag }}"
          PREV="$(git tag -l 'welder-editor@v*' --sort=-v:refname | grep -v "^${CURRENT}\$" | head -n 1 || true)"
          NOTES_FILE="$(mktemp)"

          {
            echo "## Welder Editor v${{ steps.version.outputs.version }}"
            echo
            echo "Loadable bundle attached: \`welder-editor-v${{ steps.version.outputs.version }}.zip\`."
            echo "Unzip and load via Figma → Plugins → Development → Import plugin from manifest, pointing at \`manifest.json\`."
            echo
            if [ -n "$PREV" ]; then
              echo "### Changes since $PREV"
              echo
              git log --no-merges --format='- %s' "$PREV..$CURRENT" -- plugins/welder-editor/ || true
            else
              echo "### Initial release"
              echo
              echo "First tagged release of welder-editor."
            fi
            echo
            echo "---"
            echo "Source: https://github.com/${{ github.repository }}/commits/$CURRENT"
          } > "$NOTES_FILE"

          echo "notes-file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "--- generated notes ---"
          cat "$NOTES_FILE"
          echo "--- end notes ---"

      - name: Create or update GitHub Release on the private channel
        env:
          # PAT with write access to $RELEASES_REPO. Default GITHUB_TOKEN
          # can't reach a different repo, so this is mandatory.
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::RELEASES_REPO_TOKEN secret is missing — set it in this repo's Actions secrets (PAT with Contents:write on $RELEASES_REPO)."
            exit 1
          fi

          TAG="${{ steps.tagref.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          STAGE="welder-editor-v${VERSION}"
          ZIP="build-release/${STAGE}.zip"
          NOTES_FILE="${{ steps.notes.outputs.notes-file }}"

          # If the release already exists on the private channel (re-run
          # or retag), refresh notes + upload the artifact with --clobber
          # instead of failing.
          if gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "Release $TAG exists on $RELEASES_REPO — refreshing notes and uploading artifact"
            gh release edit "$TAG" --repo "$RELEASES_REPO" \
              --title "Welder Editor v${VERSION}" \
              --notes-file "$NOTES_FILE"
            gh release upload "$TAG" "$ZIP" --repo "$RELEASES_REPO" --clobber
          else
            echo "Creating release $TAG on $RELEASES_REPO"
            gh release create "$TAG" --repo "$RELEASES_REPO" \
              --title "Welder Editor v${VERSION}" \
              --notes-file "$NOTES_FILE" \
              "$ZIP"
          fi

      - name: Cleanup staging
        if: always()
        run: rm -rf build-release
