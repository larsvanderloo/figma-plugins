name: Validate

# Build + test gate for PRs and main pushes.
#
# The workflow name "Validate" is referenced by monday-sync.yml's workflow_run
# trigger so this workflow's completion status feeds Monday's Validation Status
# column on the linked item.
#
# Three parallel jobs:
#   node — pnpm install + lint + vue-tsc + vitest + build (all workspace packages).
#   python — ruff lint + format check + mypy + pytest (lint & unit tests for
#            tooling under tools/).
#   manifest — JSON schema validation for every plugins/*/manifest.json.
#
# Self-hosted macOS arm64 runner. No GitHub Actions billing exposure.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node — pnpm + eslint + vue-tsc + vitest + build
    runs-on: [self-hosted, macOS, ARM64]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Self-hosted runner has Node 20+ and pnpm 9+ pre-installed via Homebrew.
        # If you fork this and need actions/setup-node, swap in here.
        run: |
          node --version
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint + prettier check)
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Unit + component tests
        # Exit code 1 with no test files = "no tests collected"; treat as success
        # during early sprints before any test files exist. Promote to failure
        # once the first test_*.ts lands.
        shell: bash
        run: |
          set +e
          pnpm test
          rc=$?
          # Pass exit code 0 (tests ran, all passed) AND any documented
          # "no tests collected" code through.
          exit $rc

      - name: Build all plugins
        run: pnpm build

  python:
    name: Python — ruff + mypy + pytest
    runs-on: [self-hosted, macOS, ARM64]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python venv
        # System python3 (>= 3.11 required for tomllib). Avoids actions/setup-python
        # which hard-codes /Users/runner/hostedtoolcache and breaks self-hosted.
        run: |
          python3 -m venv .venv-ci
          .venv-ci/bin/pip install --quiet --upgrade pip
          .venv-ci/bin/pip install --quiet -e '.[dev]'

      - name: Ruff lint
        run: .venv-ci/bin/ruff check

      - name: Ruff format check
        run: .venv-ci/bin/ruff format --check

      - name: Mypy (tools/ — non-strict)
        run: .venv-ci/bin/mypy tools/

      - name: Pytest
        # Exit code 5 = "no tests collected" — treat as success during early
        # sprints before any test files exist. Promote to failure once the
        # first test_*.py lands.
        shell: bash
        run: |
          set +e
          .venv-ci/bin/pytest -q
          rc=$?
          if [ $rc -eq 5 ]; then
            echo "::warning::pytest collected no tests (early sprint — expected until first test_*.py lands)"
            exit 0
          fi
          exit $rc

  manifest:
    name: Manifest validation
    runs-on: [self-hosted, macOS, ARM64]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate every plugin manifest
        # Lightweight JSON-shape check against a minimal Figma manifest schema.
        # Catches typos in editorType, missing required fields, etc., before
        # the plugin fails to load in Figma.
        shell: bash
        run: |
          set -e
          for manifest in plugins/*/manifest.json; do
            if [ ! -f "$manifest" ]; then
              continue
            fi
            echo "Validating $manifest"
            # Skip the _template manifest until first plugin scaffolds.
            case "$manifest" in
              plugins/_template/manifest.json)
                echo "  (template — skipped)"
                continue
                ;;
            esac
            python3 -c "
import json, sys
with open('$manifest') as f:
    m = json.load(f)
required = ['name', 'id', 'api', 'main', 'ui', 'editorType']
missing = [k for k in required if k not in m]
if missing:
    print(f'ERROR: missing keys {missing}')
    sys.exit(1)
allowed_editors = {'figma', 'figjam', 'slides'}
unknown = set(m.get('editorType', [])) - allowed_editors
if unknown:
    print(f'ERROR: unknown editorType values {unknown}')
    sys.exit(1)
print('  OK')
"
          done
