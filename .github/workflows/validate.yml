name: Validate

# Minimal CI gate. Validates every plugins/*/manifest.json against the Figma
# manifest schema. Triggered on PRs, pushes to main, manual workflow_dispatch
# from a Monday recipe, or `gh workflow run validate.yml`.
#
# The full lint + vue-tsc + vitest + build matrix is deferred until the
# self-hosted runner has pnpm/node in PATH (see HANDOFF.md TODOs).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  manifest:
    name: Manifest validation
    runs-on: [self-hosted, macOS, ARM64]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate every plugin manifest
        shell: bash
        run: |
          set -e
          for manifest in plugins/*/manifest.json; do
            [ -f "$manifest" ] || continue
            case "$manifest" in
              plugins/_template/manifest.json)
                echo "Skipping $manifest (template)"
                continue
                ;;
            esac
            echo "Validating $manifest"
            python3 tools/validate_manifest.py "$manifest"
          done
          echo ""
          echo "All plugin manifests valid."
