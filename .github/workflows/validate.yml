name: Validate

# CI gate. Three parallel jobs:
#   manifest — JSON-shape check on every plugins/*/manifest.json
#   node     — pnpm install + lint + vue-tsc + vitest + build
#   python   — ruff + mypy + pytest
#
# Triggers: PRs (opened/sync/reopen/ready-for-review), pushes to main,
# manual workflow_dispatch (Monday recipes can call this).
#
# Self-hosted macOS arm64 runner. The runner is launchd-spawned, which
# means /opt/homebrew/bin is NOT in PATH by default — the `env: PATH:`
# block on the node + python jobs adds it so pnpm/node/python3 resolve.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Used by node + python jobs. The launchd-spawned runner inherits a minimal
# PATH; Homebrew binaries are at /opt/homebrew/bin on Apple-Silicon Macs.
env:
  PATH_HOMEBREW: /opt/homebrew/bin:/opt/homebrew/sbin:/usr/bin:/bin:/usr/sbin:/sbin

jobs:
  manifest:
    name: Manifest validation
    runs-on: [self-hosted, macOS, ARM64]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate every plugin manifest
        shell: bash
        run: |
          set -e
          for manifest in plugins/*/manifest.json; do
            [ -f "$manifest" ] || continue
            case "$manifest" in
              plugins/_template/manifest.json)
                echo "Skipping $manifest (template)"
                continue
                ;;
            esac
            echo "Validating $manifest"
            python3 tools/validate_manifest.py "$manifest"
          done
          echo ""
          echo "All plugin manifests valid."

  node:
    name: Node — eslint + vue-tsc + vitest + build
    runs-on: [self-hosted, macOS, ARM64]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      PATH: /opt/homebrew/bin:/opt/homebrew/sbin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versions
        run: |
          node --version
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint + prettier check)
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Unit + component tests
        run: pnpm test

      - name: Build all plugins
        run: pnpm build

  axe:
    name: Accessibility — axe-core WCAG 2.1 AA (welder-editor)
    runs-on: [self-hosted, macOS, ARM64]
    # Run after the main node job so the lock-file install is cached.
    needs: node
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      PATH: /opt/homebrew/bin:/opt/homebrew/sbin:/usr/bin:/bin:/usr/sbin:/sbin
    #
    # Gating policy (matches plugins/welder-editor/tests/ui/axe.test.ts):
    #
    #   BLOCKING NOW   — axe violations at impact "serious" or "critical".
    #                    These fail the test and therefore fail this job.
    #
    #   WARN ONLY NOW  — axe violations at impact "moderate" or "minor".
    #                    Logged as console.warn; test passes; job passes.
    #                    Promoted to BLOCKING at Sprint 2 RC, when ui-engineer
    #                    has had a full sprint to address them.
    #
    # Why jsdom instead of headless Chromium:
    #   jsdom is already in the lockfile (jsdom@24.1.3 via vitest).
    #   Adding Playwright/Chromium would add ~300 MB to the runner and require
    #   a separate browser-install step. axe-core's WCAG 2.1 AA rule coverage
    #   is equivalent in jsdom for the rules that matter at this stage: ARIA
    #   labels, role semantics, focus management. Color-contrast (which needs
    #   real CSS layout) is supplemented by the manual VoiceOver pass at RC.
    #   Revisit this decision if a component needs real CSS layout for a11y
    #   evaluation (file an ADR at that point).
    #
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versions
        run: |
          node --version
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run axe scan (welder-editor)
        # Runs tests/ui/axe.test.ts via vitest. The test file enforces the
        # blocking/advisory policy documented above and in the test source.
        run: pnpm --filter @figma-plugins/welder-editor exec vitest run tests/ui/axe.test.ts

  bundle-size:
    name: Bundle-size gate — welder-editor (ADR-0003)
    runs-on: [self-hosted, macOS, ARM64]
    # Runs after the node job so we know the lockfile is consistent.
    # The node job already ran `pnpm build`; we rebuild here because jobs
    # do not share filesystem state — each job gets a fresh checkout.
    needs: node
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      PATH: /opt/homebrew/bin:/opt/homebrew/sbin:/usr/bin:/bin:/usr/sbin:/sbin
    #
    # Budgets from ADR-0003 (docs/adr/0003-welder-editor-bundle-budget.md):
    #   code-side  dist/code.js  ≤ 60 KB gzipped
    #   ui-side    dist/ui.js    ≤ 250 KB gzipped
    #
    # ARTIFACT NOTE: ADR-0003 and the perf doc originally referenced
    # dist/ui.html as the ui artifact (Vite single-file inline HTML).  The
    # Vite multi-entry config produces dist/ui.js (JS bundle) +
    # dist/ui/index.html (HTML shell, ~255 bytes).  The JS bundle
    # dist/ui.js is the correct artifact to gate against the 250 KB budget;
    # dist/ui/index.html is a trivially-small shell that is not the deliverable.
    #
    # manifest.json was corrected to "ui": "dist/ui/index.html" in PR #22
    # (BDEV-2893950198).  The path discrepancy is resolved.
    #
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versions
        run: |
          node --version
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build all plugins
        run: pnpm build

      - name: Bundle-size gate (code-side)
        run: |
          BYTES=$(gzip -c plugins/welder-editor/dist/code.js | wc -c)
          BUDGET=$((60 * 1024))
          echo "code.js gzip = $BYTES bytes (budget $BUDGET)"
          if [ "$BYTES" -gt "$BUDGET" ]; then
            echo "::error::dist/code.js gzipped $BYTES bytes exceeds 60 KB budget per ADR-0003"
            exit 1
          fi

      - name: Bundle-size gate (ui-side)
        # Gates dist/ui.js — the actual JS bundle produced by the Vite multi-
        # entry build.  Budget is 250 KB per ADR-0003.
        run: |
          BYTES=$(gzip -c plugins/welder-editor/dist/ui.js | wc -c)
          BUDGET=$((250 * 1024))
          echo "ui.js gzip = $BYTES bytes (budget $BUDGET)"
          if [ "$BYTES" -gt "$BUDGET" ]; then
            echo "::error::dist/ui.js gzipped $BYTES bytes exceeds 250 KB budget per ADR-0003"
            exit 1
          fi

  frame-trace-perf:
    name: Frame-trace perf gate — TableEditor (R1)
    runs-on: [self-hosted, macOS, ARM64]
    # Run after the main node job so the lockfile install is cached.
    needs: node
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (
        github.event_name != 'pull_request' ||
        contains(join(github.event.pull_request.labels.*.name, ','), 'perf') ||
        true
      )
    env:
      PATH: /opt/homebrew/bin:/opt/homebrew/sbin:/usr/bin:/bin:/usr/sbin:/sbin
    #
    # Gating policy (R1 from docs/perf/welder-editor.md §"Frame-trace perf gate"):
    #
    #   BLOCKING — each PropertyPanel collapsible toggle on a 50-row × 6-col
    #   TableEditor fixture must complete in < 16 ms (one frame at 60 Hz).
    #   Failure = job fails = PR blocked.
    #
    # Path trigger: this job always runs (path filtering is not natively
    # supported in job-level `if` without the changed-files action).
    # The job is fast (~30 s) so the cost of running it on every non-draft PR
    # is acceptable. Narrowing to path-specific runs can be added in a follow-up
    # when the changed-files action is available on the self-hosted runner.
    #
    # Affected paths (documented for reviewers; not programmatic):
    #   sections/TableEditor/**
    #   components/src/PropertyPanel/**
    #   plugins/welder-editor/code/wrappers/TableWrap.ts
    #   plugins/welder-editor/ui/App.vue
    #
    # Determinism note (see docs/perf/welder-editor.md §"Frame-trace perf gate"):
    #   The benchmark uses performance.now() in jsdom. jsdom does not execute
    #   real CSS transitions or layout; the timing covers only Vue's reactive
    #   update cycle and synchronous JS triggered by the toggle. Toggle 1 has
    #   a cold-start JIT penalty (~2 ms on a warm CI runner); toggles 2–10
    #   are in the 0.1–0.6 ms range. The gate asserts all 10 (including the
    #   first) are < 16 ms, providing an 8× budget over the observed max.
    #   No warm-up discard is applied; the cold-start cost is well within budget
    #   and discarding it would mask any JIT-path regression.
    #
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versions
        run: |
          node --version
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Frame-trace perf gate (TableEditor R1)
        # Runs tests/perf.test.ts via vitest --reporter=verbose.
        # Per-toggle timings are printed via console.warn inside the test
        # (search for "[perf-gate]" in the job log for the timing table).
        # The test fails (exit non-zero) if any toggle exceeds 16 ms.
        run: |
          pnpm --filter @figma-plugins/sections-table-editor exec \
            vitest run --reporter=verbose tests/perf.test.ts

  python:
    name: Python — ruff + mypy + pytest
    runs-on: [self-hosted, macOS, ARM64]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      PATH: /opt/homebrew/bin:/opt/homebrew/sbin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python venv
        run: |
          python3 -m venv .venv-ci
          .venv-ci/bin/pip install --quiet --upgrade pip
          .venv-ci/bin/pip install --quiet -e '.[dev]'

      - name: Ruff lint
        run: .venv-ci/bin/ruff check

      - name: Ruff format check
        run: .venv-ci/bin/ruff format --check

      - name: Mypy
        run: .venv-ci/bin/mypy tools/

      - name: Pytest
        # Exit code 5 = "no tests collected" — treat as success during early
        # sprints before any test files exist. Promote to failure once the
        # first test_*.py lands.
        shell: bash
        run: |
          set +e
          .venv-ci/bin/pytest -q
          rc=$?
          if [ $rc -eq 5 ]; then
            echo "::warning::pytest collected no tests (early sprint — expected)"
            exit 0
          fi
          exit $rc
