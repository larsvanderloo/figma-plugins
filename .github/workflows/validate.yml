name: Validate

# CI gate. Three parallel jobs:
#   manifest — JSON-shape check on every plugins/*/manifest.json
#   node     — pnpm install + lint + vue-tsc + vitest + build
#   python   — ruff + mypy + pytest
#
# Triggers: PRs (opened/sync/reopen/ready-for-review), pushes to main,
# manual workflow_dispatch (Monday recipes can call this).
#
# Self-hosted macOS arm64 runner. The runner is launchd-spawned, which
# means /opt/homebrew/bin is NOT in PATH by default — the `env: PATH:`
# block on the node + python jobs adds it so pnpm/node/python3 resolve.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Used by node + python jobs. The launchd-spawned runner inherits a minimal
# PATH; Homebrew binaries are at /opt/homebrew/bin on Apple-Silicon Macs.
env:
  PATH_HOMEBREW: /opt/homebrew/bin:/opt/homebrew/sbin:/usr/bin:/bin:/usr/sbin:/sbin

jobs:
  manifest:
    name: Manifest validation
    runs-on: [self-hosted, macOS, ARM64]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate every plugin manifest
        shell: bash
        run: |
          set -e
          for manifest in plugins/*/manifest.json; do
            [ -f "$manifest" ] || continue
            case "$manifest" in
              plugins/_template/manifest.json)
                echo "Skipping $manifest (template)"
                continue
                ;;
            esac
            echo "Validating $manifest"
            python3 tools/validate_manifest.py "$manifest"
          done
          echo ""
          echo "All plugin manifests valid."

  node:
    name: Node — eslint + vue-tsc + vitest + build
    runs-on: [self-hosted, macOS, ARM64]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      PATH: /opt/homebrew/bin:/opt/homebrew/sbin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versions
        run: |
          node --version
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint + prettier check)
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Unit + component tests
        run: pnpm test

      - name: Build all plugins
        run: pnpm build

  python:
    name: Python — ruff + mypy + pytest
    runs-on: [self-hosted, macOS, ARM64]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      PATH: /opt/homebrew/bin:/opt/homebrew/sbin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python venv
        run: |
          python3 -m venv .venv-ci
          .venv-ci/bin/pip install --quiet --upgrade pip
          .venv-ci/bin/pip install --quiet -e '.[dev]'

      - name: Ruff lint
        run: .venv-ci/bin/ruff check

      - name: Ruff format check
        run: .venv-ci/bin/ruff format --check

      - name: Mypy
        run: .venv-ci/bin/mypy tools/

      - name: Pytest
        # Exit code 5 = "no tests collected" — treat as success during early
        # sprints before any test files exist. Promote to failure once the
        # first test_*.py lands.
        shell: bash
        run: |
          set +e
          .venv-ci/bin/pytest -q
          rc=$?
          if [ $rc -eq 5 ]; then
            echo "::warning::pytest collected no tests (early sprint — expected)"
            exit 0
          fi
          exit $rc
