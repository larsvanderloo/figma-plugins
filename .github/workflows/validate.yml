name: Validate

# CI gate. Three parallel jobs:
#   manifest — JSON-shape check on every plugins/*/manifest.json
#   node     — pnpm install + lint + vue-tsc + vitest + build
#   python   — ruff + mypy + pytest
#
# Triggers: PRs (opened/sync/reopen/ready-for-review), pushes to main,
# manual workflow_dispatch (Monday recipes can call this).
#
# Self-hosted macOS arm64 runner. The runner is launchd-spawned, which
# means /opt/homebrew/bin is NOT in PATH by default — the `env: PATH:`
# block on the node + python jobs adds it so pnpm/node/python3 resolve.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Used by node + python jobs. The launchd-spawned runner inherits a minimal
# PATH; Homebrew binaries are at /opt/homebrew/bin on Apple-Silicon Macs.
env:
  PATH_HOMEBREW: /opt/homebrew/bin:/opt/homebrew/sbin:/usr/bin:/bin:/usr/sbin:/sbin

jobs:
  manifest:
    name: Manifest validation
    runs-on: [self-hosted, macOS, ARM64]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate every plugin manifest
        shell: bash
        run: |
          set -e
          for manifest in plugins/*/manifest.json; do
            [ -f "$manifest" ] || continue
            case "$manifest" in
              plugins/_template/manifest.json)
                echo "Skipping $manifest (template)"
                continue
                ;;
              plugins/welder-editor/manifest.json)
                # Out-of-band npm-driven plugin (excluded from pnpm workspace).
                # Manifest + artifacts are validated in the npm-plugin-welder-editor job.
                echo "Skipping $manifest (handled by npm-plugin-welder-editor job)"
                continue
                ;;
            esac
            echo "Validating $manifest"
            python3 tools/validate_manifest.py "$manifest"
          done
          echo ""
          echo "All plugin manifests valid."

  node:
    name: Node — eslint + vue-tsc + vitest + build
    runs-on: [self-hosted, macOS, ARM64]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      PATH: /opt/homebrew/bin:/opt/homebrew/sbin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versions
        run: |
          node --version
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build all plugins
        # Build runs BEFORE typecheck because @nuxt/ui/vite (unplugin-vue-components
        # + unplugin-auto-import) generates components.d.ts and auto-imports.d.ts
        # during `vite build`. vue-tsc needs those files to resolve <UInput>,
        # <UFormField> and composable globals. Without them, every Nuxt UI
        # primitive is an "unknown global" and the typecheck fails.
        # Ref: v0.2.1 audit (docs/learnings/anti-patterns/0003-*.md).
        run: pnpm build

      - name: Type-check
        run: pnpm typecheck

      - name: Unit + component tests
        run: pnpm test

      - name: Lint (eslint + prettier check)
        run: pnpm lint

  build-artifacts:
    name: Build artifact validation — IIFE + singlefile checks
    runs-on: [self-hosted, macOS, ARM64]
    # Runs after the node job (which builds all plugins) so dist/ artifacts exist.
    # Each job gets a fresh checkout, so we rebuild here.
    needs: node
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      PATH: /opt/homebrew/bin:/opt/homebrew/sbin:/usr/bin:/bin:/usr/sbin:/sbin
    #
    # Checks (Sprint 3 retro action item A1):
    #   1. dist/code.js must be an IIFE — first chars contain neither ^import nor ^export.
    #      Regression here means the code-side bundle leaked ES module syntax, which
    #      Figma's plugin sandbox rejects with "Unexpected token".
    #   2. dist/ui.html (or dist/ui/index.html) must be self-contained — zero
    #      <script src=...> or <link href=...> external references. Regression here
    #      means vite-plugin-singlefile stopped inlining, which causes a silent load
    #      failure inside the Figma iframe sandbox.
    #
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versions
        run: |
          node --version
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build all plugins
        run: pnpm build

      - name: Validate build artifacts (IIFE + singlefile)
        run: |
          set -e
          for manifest in plugins/*/manifest.json; do
            [ -f "$manifest" ] || continue
            case "$manifest" in
              plugins/_template/manifest.json)
                echo "Skipping $manifest (template)"
                continue
                ;;
              plugins/welder-editor/manifest.json)
                # Out-of-band npm-driven plugin (excluded from pnpm workspace,
                # so `pnpm build` above doesn't produce its dist/). Validated
                # in the npm-plugin-welder-editor job which builds with npm first.
                echo "Skipping $manifest (handled by npm-plugin-welder-editor job)"
                continue
                ;;
            esac
            echo "Validating build artifacts for $manifest"
            python3 tools/validate_manifest.py --build-artifacts "$manifest"
          done
          echo ""
          echo "All plugin build artifacts valid."

  # ---------------------------------------------------------------------------
  # The previous `axe`, `bundle-size`, and `frame-trace-perf` jobs lived here.
  # They were hardcoded against the deleted pnpm-driven welder-editor
  # (`pnpm --filter @figma-plugins/welder-editor`, `dist/ui/index.html`,
  # `tests/ui/axe.test.ts`, `tests/perf.test.ts`). The current welder-editor
  # is npm-driven with a widget-src/ layout and has none of those tests yet.
  # Re-introduce equivalents (axe scan on widget-src/ui, gzipped bundle gate,
  # perf gate on a chosen surface) when the testing surface is stood up,
  # ideally as part of T_REFACTOR_LAYOUT (see ADR-0017).
  # ---------------------------------------------------------------------------

  npm-plugin-welder-editor:
    name: welder-editor (npm-driven)
    runs-on: [self-hosted, macOS, ARM64]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      PATH: /opt/homebrew/bin:/opt/homebrew/sbin:/usr/bin:/bin:/usr/sbin:/sbin
    #
    # welder-editor is intentionally excluded from the pnpm workspace
    # (ADR-0017) — it uses npm + Vite 8 + vue-tsc 3, diverging from the rest
    # of the monorepo. CI runs build + typecheck + manifest/artifact
    # validation here in isolation. The pnpm-driven `manifest` and
    # `build-artifacts` jobs above explicitly skip this plugin's manifest,
    # so this job is the single source of truth for its CI gate.
    #
    # All steps below are GATING. There is no continue-on-error; if a step
    # fails the PR is blocked.
    #
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install (npm ci with lockfile fallback)
        working-directory: plugins/welder-editor
        # Prefer `npm ci` (frozen-lockfile semantics). Fall back to
        # `npm install` if the lockfile drifts so a transient mismatch
        # doesn't block the gate; the fallback emits a warning so it
        # stays visible.
        run: |
          if ! npm ci --no-audit --no-fund; then
            echo "::warning::npm ci failed (lockfile drift) — falling back to npm install"
            npm install --no-audit --no-fund
          fi

      - name: Build + typecheck
        working-directory: plugins/welder-editor
        run: |
          npm run build
          npm run typecheck:ui

      - name: Validate manifest + build artifacts
        run: |
          python3 tools/validate_manifest.py plugins/welder-editor/manifest.json
          python3 tools/validate_manifest.py --build-artifacts plugins/welder-editor/manifest.json

  python:
    name: Python — ruff + mypy + pytest
    runs-on: [self-hosted, macOS, ARM64]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      PATH: /opt/homebrew/bin:/opt/homebrew/sbin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python venv
        run: |
          python3 -m venv .venv-ci
          .venv-ci/bin/pip install --quiet --upgrade pip
          .venv-ci/bin/pip install --quiet -e '.[dev]'

      - name: Ruff lint
        run: .venv-ci/bin/ruff check

      - name: Ruff format check
        run: .venv-ci/bin/ruff format --check

      - name: Mypy
        run: .venv-ci/bin/mypy tools/

      - name: Pytest
        # Exit code 5 = "no tests collected" — treat as success during early
        # sprints before any test files exist. Promote to failure once the
        # first test_*.py lands.
        shell: bash
        run: |
          set +e
          .venv-ci/bin/pytest -q
          rc=$?
          if [ $rc -eq 5 ]; then
            echo "::warning::pytest collected no tests (early sprint — expected)"
            exit 0
          fi
          exit $rc
